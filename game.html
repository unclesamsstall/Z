<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Uncle Sam's Pure Good - Doha Map Run</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #10b981;
            --primary-glow: #34d399;
            --bg-dark: #1e293b;
            --map-bg: #f4f3f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            touch-action: manipulation;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--map-bg);
            color: #1e293b;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* HUD Bar */
        .hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            z-index: 10;
        }

        .hud-top-bar {
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            gap: 12px;
        }

        .hud-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.12);
            border-radius: 14px;
            padding: 10px 18px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .brand-tag {
            font-size: 0.65rem;
            font-weight: 800;
            color: #64748b;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        .hud-value {
            font-size: 1.35rem;
            font-weight: 800;
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            color: #0f172a;
        }

        /* Minimap Radar Top Right */
        #minimap-card {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 115px;
            height: 115px;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #cbd5e1;
            border-radius: 18px;
            overflow: hidden;
            pointer-events: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            z-index: 20;
        }

        #minimapCanvas {
            width: 100%;
            height: 100%;
        }

        /* Overlays */
        .screen-overlay {
            position: absolute;
            inset: 0;
            background: rgba(244, 243, 240, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 1;
            transition: opacity 0.3s ease;
            pointer-events: auto;
            padding: 20px;
        }

        .screen-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .menu-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            padding: 32px 28px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }

        .logo-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 12px;
            border-radius: 16px;
            background: #f8fafc;
            padding: 6px;
        }

        .menu-title {
            font-size: 1.7rem;
            font-weight: 900;
            margin-bottom: 6px;
            color: #0f172a;
        }

        .menu-subtitle {
            color: #64748b;
            font-size: 0.85rem;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .btn-primary {
            background: #10b981;
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .touch-controls-container {
            pointer-events: auto;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            padding-bottom: 8px;
        }

        .touch-btn {
            width: 58px;
            height: 58px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
            touch-action: manipulation;
        }

        .touch-btn:active {
            background: #34d399;
            color: white;
            transform: scale(0.92);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="minimap-card">
            <canvas id="minimapCanvas" width="115" height="115"></canvas>
        </div>

        <div class="hud-overlay">
            <div class="hud-top-bar">
                <div class="hud-card">
                    <div class="brand-tag">Uncle Sam • Doha</div>
                    <div class="hud-value" id="hud-money">$0.00</div>
                </div>

                <div class="hud-card">
                    <div class="brand-tag">Shift Timer</div>
                    <div class="hud-value" id="hud-timer">60s</div>
                </div>
            </div>

            <div class="touch-controls-container">
                <div style="display: flex; gap: 10px;">
                    <div class="touch-btn" id="btn-left"><i data-lucide="arrow-left"></i></div>
                    <div class="touch-btn" id="btn-right"><i data-lucide="arrow-right"></i></div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="touch-btn" id="btn-up" style="background: rgba(16, 185, 129, 0.2);"><i data-lucide="arrow-up"></i></div>
                    <div class="touch-btn" id="btn-down" style="background: rgba(248, 113, 113, 0.2);"><i data-lucide="arrow-down"></i></div>
                </div>
            </div>
        </div>

        <!-- Start Overlay -->
        <div class="screen-overlay" id="start-screen">
            <div class="menu-card">
                <img src="logo.png" id="menu-logo" alt="Uncle Sam" class="logo-img" onerror="this.src='word.png'; this.onerror=null;">
                <div class="brand-tag">Doha Map & Airport</div>
                <div class="menu-title">DOHA COAST RUN</div>
                <div class="menu-subtitle">Drive along curved coastal avenues, dodge pastel cars angled strictly along roads, and explore the airport area!</div>

                <button class="btn-primary" onclick="startGame()">
                    <i data-lucide="navigation" style="width: 20px; height: 20px;"></i>
                    Start Delivery
                </button>
            </div>
        </div>

        <!-- Game Over Overlay -->
        <div class="screen-overlay hidden" id="gameover-screen">
            <div class="menu-card">
                <div class="brand-tag">Shift Complete</div>
                <div class="menu-title" style="color: #ef4444;">TIME EXPIRED</div>
                <div class="menu-subtitle" id="gameover-reason">Shift time finished!</div>

                <div style="margin: 18px 0; background: #f8fafc; padding: 18px; border-radius: 18px; border: 1px solid #e2e8f0;">
                    <div style="font-size: 0.75rem; text-transform: uppercase; color: #64748b; font-weight:700;">Total Deliveries</div>
                    <div style="font-size: 2.3rem; font-weight: 900; font-family: monospace; color: #10b981;" id="final-money">$0.00</div>
                </div>

                <button class="btn-primary" onclick="restartGame()">
                    <i data-lucide="rotate-ccw" style="width: 20px; height: 20px;"></i>
                    Play Again
                </button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Logo loader
        const logoImg = new Image();
        let logoLoaded = false;
        logoImg.src = 'logo.png';
        logoImg.onload = () => { logoLoaded = true; };
        logoImg.onerror = () => {
            logoImg.src = 'word.png';
            logoImg.onerror = null;
        };

        // Audio Effects
        class AudioSynth {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
            }
            playCash() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1320, this.ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.12);
            }
            playCrash() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(160, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.2);
            }
        }

        const audio = new AudioSynth();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const minimapCanvas = document.getElementById('minimapCanvas');
        const miniCtx = minimapCanvas.getContext('2d');

        const WORLD = { width: 3600, height: 3600, roadWidth: 44 };
        const PASTELS = ['#fbcfe8', '#bae6fd', '#e9d5ff', '#fde68a', '#fca5a5', '#cbd5e1'];

        const GAME = {
            active: false,
            money: 0,
            timer: 60,
            shake: 0,
            camera: { x: 1800, y: 1800 },
            truck: {
                x: 1800, y: 1800, width: 28, height: 50, angle: 0,
                speed: 0, maxSpeed: 7.5, accel: 0.3, friction: 0.95
            },
            target: { x: 0, y: 0, radius: 45 },
            particles: [],
            roads: [],
            enemyCars: [],
            buildings: [],
            airport: { x: 2500, y: 2200, w: 900, h: 1000 }
        };

        const keys = { up: false, down: false, left: false, right: false };

        // Generate Wavy Spline Curves for Natural Streets
        function generateSplinePath(points, numSamples = 150) {
            const sampledPath = [];
            for (let i = 0; i < points.length - 1; i++) {
                const p0 = points[Math.max(0, i - 1)];
                const p1 = points[i];
                const p2 = points[i + 1];
                const p3 = points[Math.min(points.length - 1, i + 2)];

                for (let t = 0; t < 1; t += 1 / (numSamples / (points.length - 1))) {
                    const tt = t * t;
                    const ttt = tt * t;

                    const x = 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * tt + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * ttt);
                    const y = 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * tt + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * ttt);

                    sampledPath.push({ x, y });
                }
            }
            return sampledPath;
        }

        // Generate Map
        function generateDohaMap() {
            GAME.buildings = [];
            GAME.enemyCars = [];
            GAME.particles = [];
            GAME.roads = [];

            // Curved Road Points (Non-Grid)
            const rawRoads = [
                [{x: 200, y: 300}, {x: 800, y: 450}, {x: 1500, y: 300}, {x: 2300, y: 600}, {x: 3200, y: 400}],
                [{x: 300, y: 800}, {x: 900, y: 1200}, {x: 1800, y: 1000}, {x: 2600, y: 1400}, {x: 3300, y: 1200}],
                [{x: 400, y: 1800}, {x: 1200, y: 1600}, {x: 2000, y: 2000}, {x: 2800, y: 1900}, {x: 3400, y: 2200}],
                [{x: 200, y: 2800}, {x: 1000, y: 2600}, {x: 1800, y: 3000}, {x: 2700, y: 2800}, {x: 3300, y: 3200}],
                [{x: 500, y: 200}, {x: 700, y: 1000}, {x: 450, y: 2000}, {x: 600, y: 3200}],
                [{x: 1400, y: 200}, {x: 1600, y: 1200}, {x: 1350, y: 2200}, {x: 1500, y: 3300}],
                [{x: 2400, y: 200}, {x: 2250, y: 1100}, {x: 2300, y: 2000}, {x: 2200, y: 3300}]
            ];

            rawRoads.forEach((pts, idx) => {
                const path = generateSplinePath(pts, 120);
                GAME.roads.push({ path, isMain: idx % 2 === 0 });
            });

            // Large Towers & Small Villas
            for (let i = 0; i < 90; i++) {
                const bx = 200 + Math.random() * (WORLD.width - 600);
                const by = 200 + Math.random() * (WORLD.height - 600);

                if (bx > GAME.airport.x - 100 && by > GAME.airport.y - 100) continue;

                const isLarge = Math.random() < 0.35;
                const w = isLarge ? 110 + Math.random() * 80 : 40 + Math.random() * 30;
                const h = isLarge ? 110 + Math.random() * 80 : 40 + Math.random() * 30;

                GAME.buildings.push({
                    x: bx, y: by, width: w, height: h,
                    color: isLarge ? '#cbd5e1' : '#e2e8f0',
                    isLarge: isLarge
                });
            }

            // Spawn Pastel Traffic Cars oriented to roads
            for (let i = 0; i < 40; i++) {
                const selectedRoad = GAME.roads[Math.floor(Math.random() * GAME.roads.length)];
                const path = selectedRoad.path;
                const startIndex = Math.floor(Math.random() * (path.length - 20));

                GAME.enemyCars.push({
                    roadPath: path,
                    pathIndex: startIndex,
                    speedIndex: 0.8 + Math.random() * 0.8,
                    direction: Math.random() < 0.5 ? 1 : -1,
                    x: path[startIndex].x,
                    y: path[startIndex].y,
                    angle: 0,
                    width: 22,
                    height: 42,
                    color: PASTELS[Math.floor(Math.random() * PASTELS.length)]
                });
            }

            relocateTarget();
        }

        function relocateTarget() {
            const r = GAME.roads[Math.floor(Math.random() * GAME.roads.length)];
            const pt = r.path[Math.floor(Math.random() * r.path.length)];
            GAME.target.x = pt.x;
            GAME.target.y = pt.y;
        }

        function spawnParticles(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                GAME.particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    life: 1.0,
                    color: color
                });
            }
        }

        function setupControls() {
            const bindBtn = (id, key) => {
                const el = document.getElementById(id);
                const start = (e) => { e.preventDefault(); keys[key] = true; };
                const end = (e) => { e.preventDefault(); keys[key] = false; };
                el.addEventListener('touchstart', start); el.addEventListener('touchend', end);
                el.addEventListener('mousedown', start); el.addEventListener('mouseup', end);
                el.addEventListener('mouseleave', end);
            };

            bindBtn('btn-left', 'left'); bindBtn('btn-right', 'right');
            bindBtn('btn-up', 'up'); bindBtn('btn-down', 'down');

            window.addEventListener('keydown', (e) => {
                if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.left = true;
                if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.right = true;
                if (['ArrowUp', 'w', 'W'].includes(e.key)) keys.up = true;
                if (['ArrowDown', 's', 'S'].includes(e.key)) keys.down = true;
            });

            window.addEventListener('keyup', (e) => {
                if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.left = false;
                if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.right = false;
                if (['ArrowUp', 'w', 'W'].includes(e.key)) keys.up = false;
                if (['ArrowDown', 's', 'S'].includes(e.key)) keys.down = false;
            });
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        let shiftTimer;

        function startGame() {
            audio.init();
            GAME.money = 0;
            GAME.timer = 60;
            GAME.truck.x = 1800;
            GAME.truck.y = 1800;
            GAME.truck.speed = 0;
            GAME.truck.angle = 0;
            GAME.active = true;

            generateDohaMap();

            document.getElementById('hud-money').innerText = '$0.00';
            document.getElementById('hud-timer').innerText = '60s';
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');

            clearInterval(shiftTimer);
            shiftTimer = setInterval(() => {
                if (!GAME.active) return;
                GAME.timer--;
                document.getElementById('hud-timer').innerText = `${GAME.timer}s`;
                if (GAME.timer <= 0) endGame("Shift finished!");
            }, 1000);
        }

        function endGame(reason) {
            GAME.active = false;
            clearInterval(shiftTimer);
            document.getElementById('gameover-reason').innerText = reason;
            document.getElementById('final-money').innerText = `$${GAME.money.toFixed(2)}`;
            document.getElementById('gameover-screen').classList.remove('hidden');
        }

        function restartGame() { startGame(); }

        // Game Update
        function update() {
            if (!GAME.active) return;

            const t = GAME.truck;

            if (keys.up) t.speed = Math.min(t.maxSpeed, t.speed + t.accel);
            else if (keys.down) t.speed = Math.max(-t.maxSpeed * 0.4, t.speed - t.accel);
            else t.speed *= t.friction;

            if (Math.abs(t.speed) > 0.1) {
                const turn = t.speed > 0 ? 1 : -1;
                if (keys.left) t.angle -= 0.05 * turn;
                if (keys.right) t.angle += 0.05 * turn;
            }

            t.x += Math.sin(t.angle) * t.speed;
            t.y -= Math.cos(t.angle) * t.speed;

            GAME.camera.x += (t.x - GAME.camera.x) * 0.1;
            GAME.camera.y += (t.y - GAME.camera.y) * 0.1;

            t.x = Math.max(50, Math.min(WORLD.width - 50, t.x));
            t.y = Math.max(50, Math.min(WORLD.height - 50, t.y));

            // Move traffic and orient along road curves
            GAME.enemyCars.forEach(car => {
                car.pathIndex += car.speedIndex * car.direction;

                if (car.pathIndex >= car.roadPath.length - 1) car.direction = -1;
                if (car.pathIndex <= 0) car.direction = 1;

                const currIdx = Math.floor(car.pathIndex);
                const nextIdx = Math.min(car.roadPath.length - 1, currIdx + 1);

                const p1 = car.roadPath[currIdx];
                const p2 = car.roadPath[nextIdx];

                car.x = p1.x;
                car.y = p1.y;

                // Calculate orientation angle along road curve
                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                car.angle = Math.atan2(dy, dx) + (car.direction === -1 ? Math.PI : 0);

                // Collision
                const dist = Math.hypot(car.x - t.x, car.y - t.y);
                if (dist < 30) {
                    audio.playCrash();
                    t.speed = -t.speed * 0.5;
                    GAME.shake = 10;
                    spawnParticles(t.x, t.y, '#f87171', 8);
                }
            });

            // Delivery logic
            const distToTarget = Math.hypot(GAME.target.x - t.x, GAME.target.y - t.y);
            if (distToTarget < GAME.target.radius) {
                audio.playCash();
                const reward = 35 + Math.floor(Math.random() * 25);
                GAME.money += reward;
                document.getElementById('hud-money').innerText = `$${GAME.money.toFixed(2)}`;
                spawnParticles(GAME.target.x, GAME.target.y, '#10b981', 15);
                relocateTarget();
            }

            GAME.particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.04;
                if (p.life <= 0) GAME.particles.splice(index, 1);
            });

            if (GAME.shake > 0) GAME.shake *= 0.85;
        }

        // Render Canvas
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const shakeX = (Math.random() - 0.5) * GAME.shake;
            const shakeY = (Math.random() - 0.5) * GAME.shake;

            const camX = GAME.camera.x - canvas.width / 2 + shakeX;
            const camY = GAME.camera.y - canvas.height / 2 + shakeY;

            ctx.save();
            ctx.translate(-camX, -camY);

            // Ground Map Background
            ctx.fillStyle = '#f4f3f0';
            ctx.fillRect(0, 0, WORLD.width, WORLD.height);

            // Bay Curve
            ctx.fillStyle = '#c6e2ff';
            ctx.beginPath();
            ctx.arc(WORLD.width, 0, 1000, 0, Math.PI * 2);
            ctx.fill();

            // Airport Surface
            const ap = GAME.airport;
            ctx.fillStyle = '#cbd5e1';
            ctx.fillRect(ap.x, ap.y, ap.w, ap.h);

            // Airport Runways
            ctx.fillStyle = '#475569';
            ctx.fillRect(ap.x + 100, ap.y + 150, 700, 120);
            ctx.fillRect(ap.x + 100, ap.y + 550, 700, 120);

            // Runway Stripes
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.setLineDash([15, 15]);
            ctx.beginPath();
            ctx.moveTo(ap.x + 120, ap.y + 210); ctx.lineTo(ap.x + 780, ap.y + 210);
            ctx.moveTo(ap.x + 120, ap.y + 610); ctx.lineTo(ap.x + 780, ap.y + 610);
            ctx.stroke();
            ctx.setLineDash([]);

            // Parked Planes
            for (let i = 0; i < 3; i++) {
                ctx.save();
                ctx.translate(ap.x + 200 + i * 220, ap.y + 380);
                ctx.fillStyle = '#bae6fd';
                ctx.fillRect(-15, -40, 30, 80);
                ctx.fillRect(-60, -10, 120, 20);
                ctx.restore();
            }

            // Draw Natural Wavy Curved Roads
            GAME.roads.forEach(r => {
                ctx.beginPath();
                ctx.moveTo(r.path[0].x, r.path[0].y);
                for (let i = 1; i < r.path.length; i++) {
                    ctx.lineTo(r.path[i].x, r.path[i].y);
                }
                ctx.strokeStyle = r.isMain ? '#ffe082' : '#ffffff';
                ctx.lineWidth = WORLD.roadWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();

                ctx.strokeStyle = '#e2e8f0';
                ctx.lineWidth = WORLD.roadWidth + 4;
                ctx.globalCompositeOperation = 'destination-over';
                ctx.stroke();
                ctx.globalCompositeOperation = 'source-over';
            });

            // Draw Buildings
            GAME.buildings.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.width, b.height);
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 1;
                ctx.strokeRect(b.x, b.y, b.width, b.height);

                if (b.isLarge) {
                    ctx.fillStyle = '#94a3b8';
                    ctx.fillRect(b.x + 10, b.y + 10, b.width - 20, b.height - 20);
                }
            });

            // Target Pin
            ctx.beginPath();
            ctx.arc(GAME.target.x, GAME.target.y, GAME.target.radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(16, 185, 129, 0.25)';
            ctx.fill();
            ctx.strokeStyle = '#10b981';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Render Pastel Traffic Cars
            GAME.enemyCars.forEach(car => {
                ctx.save();
                ctx.translate(car.x, car.y);
                ctx.rotate(car.angle);

                ctx.fillStyle = car.color;
                ctx.beginPath();
                ctx.roundRect(-car.height / 2, -car.width / 2, car.height, car.width, 5);
                ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.15)';
                ctx.stroke();

                ctx.fillStyle = '#334155';
                ctx.fillRect(car.height / 6, -car.width / 2 + 3, 6, car.width - 6);

                ctx.restore();
            });

            // Render Mint Food Truck
            const t = GAME.truck;
            ctx.save();
            ctx.translate(t.x, t.y);
            ctx.rotate(t.angle);

            ctx.fillStyle = '#a7f3d0';
            ctx.beginPath();
            ctx.roundRect(-t.width / 2, -t.height / 2, t.width, t.height, 6);
            ctx.fill();
            ctx.strokeStyle = '#059669';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            if (logoLoaded) {
                ctx.drawImage(logoImg, -t.width / 2 + 2, -t.height / 2 + 4, t.width - 4, t.height * 0.5);
            } else {
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 8px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('SAM', 0, -t.height / 6);
            }

            ctx.restore();
            ctx.restore();

            renderMinimap();
        }

        // Render Radar
        function renderMinimap() {
            miniCtx.clearRect(0, 0, 115, 115);
            const scale = 115 / WORLD.width;

            miniCtx.fillStyle = '#f4f3f0';
            miniCtx.fillRect(0, 0, 115, 115);

            miniCtx.fillStyle = '#94a3b8';
            miniCtx.fillRect(GAME.airport.x * scale, GAME.airport.y * scale, GAME.airport.w * scale, GAME.airport.h * scale);

            miniCtx.fillStyle = '#10b981';
            miniCtx.beginPath();
            miniCtx.arc(GAME.target.x * scale, GAME.target.y * scale, 4, 0, Math.PI * 2);
            miniCtx.fill();

            miniCtx.fillStyle = '#059669';
            miniCtx.beginPath();
            miniCtx.arc(GAME.truck.x * scale, GAME.truck.y * scale, 3, 0, Math.PI * 2);
            miniCtx.fill();
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        window.onload = () => {
            resizeCanvas();
            setupControls();
            window.addEventListener('resize', resizeCanvas);
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
